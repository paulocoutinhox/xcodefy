[build-system]
requires = ["uv_build>=0.10.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "xcodefy"
version = "0.0.2"
description = "Modern Python library and CLI for reading, writing, validating, formatting, and manipulating Xcode project.xcproj files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Paulo Coutinho" }]
keywords = ["xcode", "xcproj", "xcode-project", "swift", "apple", "json5", "project-format", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
xcodefy = "xcodefy.tool.main:main"

[project.urls]
Homepage = "https://github.com/paulocoutinhox/xcodefy"
Documentation = "https://github.com/paulocoutinhox/xcodefy/tree/main/docs"
Issues = "https://github.com/paulocoutinhox/xcodefy/issues"
Source = "https://github.com/paulocoutinhox/xcodefy"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.13",
    "twine>=6.2",
]

[tool.uv.build-backend]
module-root = "src"
source-include = [".editorconfig", ".github/**", "CLAUDE.md", "CODEOWNERS", "CONTRIBUTING.md", "Makefile", "SECURITY.md", "THIRD_PARTY_NOTICES.md", "codecov.yml", "docs/**", "extras/**", "tests/**"]

[tool.ruff]
line-length = 320
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.coverage.run]
branch = true
source = ["xcodefy"]

[tool.coverage.report]
show_missing = true
fail_under = 100
